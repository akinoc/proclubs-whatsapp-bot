services:
  - type: web
    name: proclubs-whatsapp-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: TIMEZONE
        value: Europe/Istanbul
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PHONE
        sync: false
      - key: DESK360_API_KEY
        sync: false
      - key: DESK360_INTEGRATION_ID
        sync: false
      - key: WEBHOOK_TOKEN
        sync: false
